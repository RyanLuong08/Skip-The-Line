<!DOCTYPE html>
<html lang="en">
<head>
  {% include "_head.html" %}
  <title>Vendor dashboard · Skip the Line</title>
</head>
<body>
  {% set active = "vendor" %}
  {% include "_topbar.html" %}

  <div class="toolbar">
    <label><span data-i18n="vendor_label">Vendor</span> <select id="vendorSelect"></select></label>
    <button id="pause" class="sound" type="button"></button>
    <button id="sound" class="sound" type="button" aria-pressed="false" data-i18n="sound_off">🔕 Sound off</button>
    <div class="serving"><span data-i18n="now_serving">Now serving</span> <strong id="nowServing">–</strong></div>
  </div>
  <p id="pausedBanner" class="banner" hidden data-i18n="paused_banner">App orders are paused for today.</p>
  <p id="message" class="message bad" role="status"></p>

  <main class="board">
    <section><h2><span data-i18n="col_new">New</span> <span id="count-waiting" class="count"></span></h2><div id="col-waiting"></div></section>
    <section><h2><span data-i18n="col_cooking">Cooking</span> <span id="count-cooking" class="count"></span></h2><div id="col-cooking"></div></section>
    <section><h2><span data-i18n="col_ready">Ready</span> <span id="count-ready" class="count"></span></h2><div id="col-ready"></div></section>
  </main>

  <details id="menuPanel" class="card menu-panel">
    <summary data-i18n="menu_panel">Menu: mark dishes sold out</summary>
    <ul id="menuItems" class="sold-list"></ul>
  </details>

  <script>
    // New -> Cooking -> Ready -> Picked up (or No-show). Python checks every move
    // (queue_rules.can_move, noshow_rules.can_mark_no_show).
    const $ = id => document.getElementById(id);
    const NEXT = { waiting: ["cooking", "start_cooking"], cooking: ["ready", "mark_ready"], ready: ["done", "picked_up"] };

    function el(tag, props = {}, ...children) {
      const node = Object.assign(document.createElement(tag), props);
      node.append(...children);
      return node;
    }

    async function api(url, options) {
      const res = await fetch(url, options);
      if (res.status === 401) {  // logged out (e.g. the server restarted with a new secret key)
        location.href = `/vendor/login?next=${encodeURIComponent(location.pathname + location.search)}`;
        throw new Error("Please log in again.");
      }
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Something went wrong.");
      return data;
    }
    const post = (url, body) => api(url, { method: "POST", headers: { "Content-Type": "application/json" },
                                           body: JSON.stringify(body ?? {}) });

    async function act(promise) {
      try { await promise; $("message").textContent = ""; }
      catch (error) { $("message").textContent = error.message; }
      loadOrders();
    }

    // ---------- New-order alert: a beep, a highlight and a count in the tab title ----------
    // Browsers only allow sound after a click on the page, hence the Sound button.
    let audio = null;
    let seen = null;          // ids of orders already shown for this vendor (null = first load)
    const fresh = new Set();  // new orders nobody has touched yet

    $("sound").onclick = () => {
      if (audio) { audio.close(); audio = null; }
      else { audio = new AudioContext(); beep(); }
      $("sound").textContent = t(audio ? "sound_on" : "sound_off");
      $("sound").classList.toggle("on", !!audio);
      $("sound").setAttribute("aria-pressed", String(!!audio));
    };

    function beep() {
      if (!audio) return;
      [0, 0.18].forEach((delay, i) => {  // two short notes: ding-dong
        const osc = audio.createOscillator(), gain = audio.createGain();
        osc.frequency.value = i ? 660 : 880;
        gain.gain.setValueAtTime(0.25, audio.currentTime + delay);
        gain.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + delay + 0.25);
        osc.connect(gain).connect(audio.destination);
        osc.start(audio.currentTime + delay);
        osc.stop(audio.currentTime + delay + 0.3);
      });
    }

    function noticeNewOrders(orders) {
      const ids = new Set(orders.map(o => o.id));
      if (seen) {
        const arrived = orders.filter(o => o.status === "waiting" && !seen.has(o.id));
        arrived.forEach(o => fresh.add(o.id));
        if (arrived.length) {
          beep();
          if (navigator.vibrate) navigator.vibrate(200);
        }
      }
      // an order stops being "new" once it is no longer waiting (moved or cancelled)
      for (const id of fresh) {
        if (!orders.some(o => o.id === id && o.status === "waiting")) fresh.delete(id);
      }
      seen = new Set([...(seen || []), ...ids]);
      document.title = (fresh.size ? t("new_order_title", { n: fresh.size }) : "") + "Vendor dashboard · Skip the Line";
    }

    // Remember the chosen vendor in the address, e.g. /vendor?v=fengyun-love-curry,
    // so each stall can bookmark its own dashboard.
    const params = new URLSearchParams(location.search);

    async function loadVendors() {
      const vendors = await api("/api/vendor-list");
      const chosen = params.get("v") || vendors[0]?.slug;
      $("vendorSelect").replaceChildren(...vendors.map(v =>
        el("option", { value: v.slug, selected: v.slug === chosen }, `${LANG === "zh" ? v.hall_name_zh : v.hall_name} · ${pick(v)}`)));
    }

    // ---------- Pause app orders and sold-out dishes (both reset the next morning) ----------

    let paused = false;
    function drawPause() {
      $("pause").textContent = t(paused ? "resume" : "pause");
      $("pause").classList.toggle("on", paused);
      $("pausedBanner").hidden = !paused;
    }
    $("pause").onclick = () => act(post(`/api/vendors/${$("vendorSelect").value}/pause`, { paused: !paused }));

    async function loadMenu() {
      const { items } = await api(`/api/vendors/${$("vendorSelect").value}/menu`);
      $("menuItems").replaceChildren(...items.map(i => {
        const box = el("input", { type: "checkbox", checked: i.sold_out });
        box.onchange = async () => {
          try { await post(`/api/items/${i.id}/sold-out`, { sold_out: box.checked }); }
          catch (error) { $("message").textContent = error.message; box.checked = !box.checked; }
          label.lastChild.textContent = t(box.checked ? "sold_out_today" : "available");
          row.classList.toggle("unavailable", box.checked);
        };
        const label = el("label", {}, box, " ", el("span", {}, t(i.sold_out ? "sold_out_today" : "available")));
        const row = el("li", { className: i.sold_out ? "unavailable" : "" },
                       el("span", {}, [pick(i), otherName(i)].filter(Boolean).join(" · ")), label);
        return row;
      }));
    }
    $("menuPanel").ontoggle = () => { if ($("menuPanel").open) loadMenu().catch(e => { $("message").textContent = e.message; }); };

    // ---------- Orders ----------

    // What the vendor needs to know about the money for one order.
    function payment(o) {
      const amount = `NT$${o.total}` + (o.unpriced ? t("plus_counter_short") : "");
      if (o.paid) return el("div", { className: "pay-tag is-paid" }, t("paid_amount", { amount }));
      if (o.payment === "counter") return el("div", { className: "pay-tag" }, t("collect", { amount }));
      const ok = el("button", { className: "link" }, t("confirm_paid"));
      ok.onclick = () => act(post(`/api/orders/${o.id}/paid`));
      return el("div", { className: "pay-tag is-due" }, t("transfer_from", { amount, ref: o.transfer_ref }), ok);
    }

    function card(o) {
      const [next, label] = NEXT[o.status];
      const go = el("button", { className: "primary" }, t(label));
      go.onclick = () => act(post(`/api/orders/${o.id}/status`, { status: next }));
      // A transfer order is cooked only after the money arrived (Python checks this too).
      if (o.status === "waiting" && o.payment === "transfer" && !o.paid) {
        go.disabled = true;
        go.title = t("confirm_first");
      }
      const foot = el("div", { className: "order-foot" }, go);
      if (o.status === "waiting") {
        const cancel = el("button", { className: "link" }, t("cancel"));
        const warning = o.paid ? t("refund_warning") : "";
        cancel.onclick = () => confirm(t("cancel_vendor_q", { ticket: o.ticket }) + warning) &&
                               act(post(`/api/orders/${o.id}/status`, { status: "cancelled" }));
        foot.append(cancel);
      }
      if (o.status === "ready") {
        // Only after the student had NO_SHOW_AFTER_MIN minutes to come (noshow_rules.py).
        const noShow = el("button", { className: "link", disabled: o.no_show_in > 0 },
                          o.no_show_in > 0 ? t("no_show_in", { n: o.no_show_in }) : t("no_show"));
        noShow.onclick = () => confirm(t("no_show_q", { ticket: o.ticket })) &&
                               act(post(`/api/orders/${o.id}/status`, { status: "no_show" }));
        foot.append(noShow);
      }
      const box = el("div", { className: fresh.has(o.id) ? "order is-new" : "order" },
        el("div", { className: "order-head" },
           el("span", { className: "num" }, `#${o.ticket}`),
           el("span", { className: "muted" }, t("ordered_at", { time: o.created_at, pickup: o.pickup }))),
        el("ul", {}, ...o.lines.map(l => el("li", {}, `${l.qty} × ${pick(l)}`))),
        payment(o),
        foot);
      box.onclick = () => { if (fresh.delete(o.id)) { box.classList.remove("is-new"); noticeNewOrders(lastOrders); } };
      return box;
    }

    let lastOrders = [];

    async function loadOrders() {
      const slug = $("vendorSelect").value;
      if (!slug) return;
      const { vendor, orders } = await api(`/api/vendors/${slug}/orders`);
      lastOrders = orders;
      paused = vendor.paused;
      drawPause();
      noticeNewOrders(orders);
      for (const status of ["waiting", "cooking", "ready"]) {
        const mine = orders.filter(o => o.status === status);
        $(`col-${status}`).replaceChildren(...(mine.length ? mine.map(card) : [el("p", { className: "muted" }, t("nothing"))]));
        $(`count-${status}`).textContent = mine.length;
      }
      const ready = orders.filter(o => o.status === "ready").map(o => `#${o.ticket}`);
      $("nowServing").textContent = ready.length ? ready.join(", ") : "–";
    }

    $("vendorSelect").onchange = () => {
      seen = null;  // a different stall: don't beep for all of its existing orders
      fresh.clear();
      history.replaceState(null, "", `?v=${$("vendorSelect").value}`);
      loadOrders();
      if ($("menuPanel").open) loadMenu();
    };

    document.addEventListener("DOMContentLoaded", () => {
      loadVendors().then(loadOrders).catch(error => { $("message").textContent = error.message; });
      setInterval(() => loadOrders().catch(() => {}), 3000);  // new orders show up within 3 seconds
    });
  </script>
</body>
</html>
