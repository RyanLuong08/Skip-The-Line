<!DOCTYPE html>
<html lang="en">
<head>
  {% include "_head.html" %}
  <title>Vendor login · Skip the Line</title>
</head>
<body>
  {% set active = "vendor" %}
  {% include "_topbar.html" %}

  <main class="login">
    <form class="card" method="post" action="{{ url_for('staff_auth.login') }}">
      <h2 data-i18n="login_title">Vendor login</h2>
      <p class="muted"><a href="/" data-i18n="login_hint">This page is for the stalls. Students order on the order page.</a></p>
      <label><span data-i18n="pin">PIN</span>
        <input name="pin" type="password" inputmode="numeric" autocomplete="current-password" autofocus required>
      </label>
      <input type="hidden" name="next" value="{{ next }}">
      <button class="primary" type="submit" data-i18n="open_dashboard">Open dashboard</button>
      {% if error %}<p class="message bad" role="alert">{{ error }}</p>{% endif %}
    </form>
  </main>
</body>
</html>
